name: CI

on:
  push:
    branches: [main, master, develop, frontend]
  pull_request:
    branches: [main, master, develop, frontend]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint || echo "Lint failed, but continuing for tests"
      - name: Run tests
        run: npm test -- --coverage --silent
      - name: Verify WHO IMCI test cases pass
        run: npm test -- engine/__tests__/ --verbose
